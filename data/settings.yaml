  VOLEBNÍ PROGRAM:


  5 témat pro období 2026–2030 / 


  Pět oblastí, které budou určovat naše priority v příštích čtyřech letech. Od dopravy a bezpečnosti přes školy a sport až po kvalitní veřejný prostor a další rozvoj celé městské části.
