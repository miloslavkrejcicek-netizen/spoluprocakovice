program_intro: Naše priority vycházejí z každodenní reality Čakovic, Miškovic a
  Třeboradic. Žádné sliby — jen konkrétní cíle, které umíme splnit.
program_vize: "Naše kroky budou v souladu s naší dlouhodobou strategií:
  Čakovice, Miškovice a Třeboradice jsou klidná, bezpečná okrajová čtvrť s
  kvalitním pokrytím veřejnou dopravou, kde do přírody to není daleko."
