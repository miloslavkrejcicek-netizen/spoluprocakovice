<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} · {{ .Site.Title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{{ partial "styles.html" . }}
</head>
<body>

{{ partial "site-nav.html" . }}

<div class="page-content">
  <a href="/" class="back-link">← Zpět na hlavní stránku</a>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</div>

{{ partial "site-footer.html" . }}

{{ partial "scripts.html" . }}
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
